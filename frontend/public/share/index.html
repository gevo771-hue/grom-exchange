<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#111a27;color:#edf5ff;font:16px/1.45 system-ui,sans-serif}
  body{display:grid;min-height:100vh;place-items:center;padding:24px;background:radial-gradient(ellipse at 75% 18%,#12395a 0,transparent 45%),linear-gradient(145deg,#101722,#253346)}
  main{width:min(100%,720px);padding:20px;border:1px solid #47627e;border-radius:24px;background:#172332e8;box-shadow:0 24px 80px #0008}
  img{display:block;width:100%;height:auto;border-radius:14px}
  .copy{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 4px 2px}
  p{margin:0;color:#b9c9dc}
  strong{display:block;color:#f3f8ff;font-size:20px}
  a{flex:none;padding:12px 20px;border-radius:12px;background:linear-gradient(110deg,#75d8f1,#91b7f3);color:#102134;font-weight:750;text-decoration:none}
  @media(max-width:560px){.copy{align-items:stretch;flex-direction:column}a{text-align:center}}
</style>

<main>
  <img src="https://grom.exchange/assets/og-share-grom-20260930.png" width="1200" height="630" alt="GROM Exchange — One wallet. All of DeFi." />
  <div class="copy">

    <a id="gromShareOpen" href="https://grom.exchange/">Open GROM</a>
  </div>
</main>
<script>
  try {
    var ref = new URLSearchParams(location.search).get('ref') || '';
    if (/^[A-Za-z0-9]{1,64}$/.test(ref)) {
      document.getElementById('gromShareOpen').href = '/?ref=' + encodeURIComponent(ref) + '#landing';
    }
  } catch (_) {}
</script>
