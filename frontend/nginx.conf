# Browsers get the full SPA. Crawlers keep slim per-route HTML.
map $http_user_agent $grom_crawler {
    default 0;
    "~*(Googlebot|Google-InspectionTool|AdsBot-Google|Mediapartners-Google|Storebot-Google|bingbot|BingPreview|Slurp|DuckDuckBot|Baiduspider|YandexBot|YandexImages|Applebot|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Discordbot|TelegramBot|WhatsApp|Pinterestbot|SemrushBot|AhrefsBot|MJ12bot|DotBot|PetalBot|Bytespider|GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|anthropic-ai|PerplexityBot|Amazonbot|CCBot)" 1;
}

server {

    # Never serve backup / retired UI copies (stabilization 2026-09-20)
    location ~* \.(bak|backup|old)($|\.) { return 404; }
    location ~* \.bak- { return 404; }

    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json text/plain;

    # Serve pre-compressed .gz twins from the build (zero CPU per request).
    # scripts/build-frontend.mjs emits them for every .html/.js/.css in dist.
    gzip_static on;

    # .well-known files (WalletConnect domain verification, future ACME, etc.)
    # Must NOT fall through to /index.html — return 404 if the actual file is missing.
    location /.well-known/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # OG social cards — short TTL so Binary-era / stale art cannot linger at the edge.
    location ~* ^/assets/og-(card|share)[^/]*\.(png|jpe?g|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Accept-Ranges bytes;
        types {
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
        }
    }

    # Dedicated share URL — fresh Telegram/X cache key (root URL is frozen in TG).
    # Always serve the static OG page (no UA split): CF does not Vary on User-Agent,
    # so a crawler HIT would otherwise poison browser redirects and vice versa.
    location = /share {
        return 301 /share/;
    }
    location = /share/ {
        try_files /share/index.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate";
    }

    # Static assets — long cache (filenames stable; WebP + PNG brand art)
    # Do NOT use `expires` here: it emits a second Cache-Control (max-age=…) that
    # duplicates add_header and confuses some bots/CDNs.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes;
        types {
            image/webp webp;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            image/gif gif;
        }
    }

    # Self-hosted WalletConnect bundles — Safari rejects application/octet-stream for import().
    location /wc/ {
        default_type application/javascript;
        types { application/javascript js mjs; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML: max-age=0 (browser revalidate) + s-maxage=60 (CF edge).
    # Do NOT use no-store — kills TTFB (p95 target <300ms at load).
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate";
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate";
    }

    # Version beacon for stale-tab self-reload — must never be cached.

    # Lazy page fragments — short cache; bust via deploy (files overwritten in place)
    location /pages/ {
        default_type text/html;
        add_header Cache-Control "public, max-age=60, must-revalidate";
        try_files $uri =404;
    }

    location = /version.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Content-hashed assets (grom-wallet.a7b3c9d1.js …) produced by
    # scripts/build-frontend.mjs. Name changes with content — cache forever.
    location ~ "^/[\w-]+\.[a-f0-9]{8}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Un-hashed top-level JS/CSS — dev fallback + old cached HTML still
    # referencing ?v= names. Force revalidation so these never go stale.
    location ~ ^/grom-[a-z-]+\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

  location ~ ^/r/([A-Za-z0-9]+)/?$ {
        return 302 /?ref=$1#landing;
    }

    # Product pretty-URLs (and locale prefixes).
    # Browsers → full SPA (app.html). Crawlers → slim SEO HTML on disk.
    # CRITICAL (2026-09-22): never try_files $uri/index.html for humans —
    # that served /predict/index.html (no #page-wallet/#page-futures, with
    # #gromSeoRouteCopy "About · GROM Exchange") and nav fell back to landing.
    location ~ "^/(?:(?:es|pt-BR|tr|ru|vi|id)/)?(?:swap|futures|predict|stocks|markets)/?$" {
        error_page 418 = @crawler_seo_route;
        if ($grom_crawler = 1) { return 418; }
        rewrite ^ /app.html last;
    }

    # Remaining static + SPA fallback (assets, hashed JS, unknown paths).
    location / {
        try_files $uri $uri/ @spa;
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate";
    }

    # Full SPA for browsers. Exact match beats `location /`.
    # Social crawlers (Telegram/X/…) must NOT get 404 here — people share
    # /app.html#dashboard and expect a link preview. Serve the SEO homepage
    # (same og:image / title / description) with 200 instead.
    location = /app.html {
        error_page 418 = @crawler_og;
        if ($grom_crawler = 1) { return 418; }
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location @spa {
        error_page 418 = @crawler_og;
        if ($grom_crawler = 1) { return 418; }
        if ($uri ~ ^/(?:(?:es|pt-BR|tr|ru|vi|id)/)?(?:swap|futures|predict|stocks|markets|dashboard|wallet|referral|history|settings|help|spot|binary|xstocks|backoffice|admin)(/)?$) {
            rewrite ^ /app.html last;
        }
        return 404;
    }

    # Crawler-only: slim per-route HTML built into dist/{predict,swap,…}/index.html
    location @crawler_seo_route {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate";
    }

    # Shared OG shell for crawlers hitting app.html / internal SPA routes.
    location @crawler_og {
        rewrite ^ /index.html last;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://backend:4000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://backend:4000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
